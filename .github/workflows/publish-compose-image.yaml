name: Publish Compose Node Image (GHCR)

# Builds and publishes the multi-arch (linux/amd64, linux/arm64) Docker
# Compose node image (`ghcr.io/stackgenhq/chinit-node`) from
# deploy/compose/Dockerfile to GitHub Container Registry (GHCR).
#
# The image pre-bakes ClickHouse, systemd, OpenTelemetry Collector,
# /usr/local/bin/chinit, and the default local Compose bundle, secrets,
# and per-role specs so users can boot a 3-node local cluster from a
# single copy-pasted `compose.yaml` with `docker compose up -d`.

on:
  push:
    branches: [main, master]
    tags:
      - "v0.*"
  workflow_dispatch:
    inputs:
      clickhouse_version:
        description: "ClickHouse server version override (empty = Dockerfile default)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-compose-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push ghcr.io/${{ github.repository_owner }}/chinit-node
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve chinit version and image tags
        id: version
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/chinit-node
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          IMAGE_REPO_LC="$(echo "${IMAGE_REPO}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${HEAD_SHA::7}"
          TAGS="${IMAGE_REPO_LC}:latest,${IMAGE_REPO_LC}:compose,${IMAGE_REPO_LC}:sha-${SHORT_SHA}"

          if [[ "${REF_NAME}" == v0.* ]]; then
            VERSION="${REF_NAME#v}"
            MAJOR_MINOR="$(echo "${VERSION}" | cut -d. -f1,2)"
            TAGS="${TAGS},${IMAGE_REPO_LC}:${REF_NAME},${IMAGE_REPO_LC}:${VERSION},${IMAGE_REPO_LC}:${MAJOR_MINOR}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo "${SHORT_SHA}")"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/compose/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            CHINIT_VERSION=${{ steps.version.outputs.version }}
            ${{ inputs.clickhouse_version != '' && format('CLICKHOUSE_VERSION={0}', inputs.clickhouse_version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
