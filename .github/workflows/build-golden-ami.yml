name: Build ClickHouse Golden AMI (AWS)

# Builds the golden AMI from images/aws - the prebuilt image that
# (a) cuts node bootstrap from ~8-12 min to ~2-3 min, and (b) allows nodes
# to boot without internet egress when everything is pre-installed.
#
# Auth: GitHub OIDC -> the role in secrets.AWS_PACKER_ROLE_ARN assumed via
# aws-actions/configure-aws-credentials (NO static keys).
# The ARN and account ID are SECRETS, not variables: registered secret
# values are auto-masked in public logs; a repo variable would print the
# role ARN (and the account ID embedded in it) verbatim.
#
# Cleanup: keeps the KEEP_GENERATIONS most recent AMIs tagged
# Purpose=clickhouse-golden-ami in the region; deregisters older ones and
# deletes their snapshots.

on:
  # Manual roll (optionally also building the PUBLIC share flavor):
  # dispatch with an explicit chinit_version — or leave it empty to
  # bake the clickhouse.pkr.hcl pin as committed on main (the
  # release-chinit roll-ami job owns that pin after every release).  # There is deliberately NO push trigger: a plain push to main would
  # bake whichever pin main happens to carry — typically the PREVIOUS
  # release's version, because release-chinit's roll-ami bumps the
  # pin only after its release run completes (and GITHUB_TOKEN pushes
  # never fire this workflow anyway). Release-driven builds chain
  # solely on the workflow_run trigger above, which resolves the
  # version from the released tag AFTER the assets exist.
  workflow_dispatch:
    inputs:
      clickhouse_version:
        description: "Upstream ClickHouse version (e.g. 26.8.36.3; empty = default)"
        required: false
        default: ""
      antalya_clickhouse_version:
        description: "Altinity Antalya ClickHouse version (e.g. 26.8.34.20001.altinityantalya; empty = default)"
        required: false
        default: ""
      antalya_ci_sha:
        description: "Altinity/ClickHouse antalya-26.8 commit SHA in s3://altinity-build-artifacts (empty = packer default)"
        required: false
        default: ""
      chinit_version:
        description: "chinit version override (e.g. 0.1.2; empty = packer default)"
        required: false
        default: ""
      build_flavor:
        description: "Package repo flavor(s) to build in parallel: both (default), upstream, or antalya"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - upstream
          - antalya
      publish:
        description: "Build public, cross-account consumable AMIs (unencrypted root snapshot + launchPermission=all + snapshot createVolumePermission=all)"
        required: false
        default: true
        type: boolean
  workflow_run:
    # The release→AMI roll, WITHOUT the explicit dispatch: the
    # release-chinit.yaml roll-ami job bumps the packer pin and pushes
    # it to main, then its run completes — THIS trigger fires on that
    # completion and builds against main, which by then carries the
    # bumped pin. The explicit `gh workflow run` dispatch this
    # replaces was the old close-the-loop step; workflow_run is the
    # GitHub-blessed chaining mechanism (GITHUB_TOKEN pushes do NOT
    # fire the paths trigger below — the anti-recursion guard — so
    # the bump commit alone could never start the build).
    #
    # NO branches filter ON PURPOSE: the release runs are TAG-push
    # runs whose head_branch is the tag name (v0.3.0), not main — a
    # branches: [main] filter would never match them and silently
    # break the roll. The build itself checks out main below.
    workflows: ["Release chinit"]
    types: [completed]

env:
  AWS_REGION: us-west-2
  PACKER_DIR: images/aws
  KEEP_GENERATIONS: "3"

permissions:
  id-token: write # OIDC
  contents: read

# Serialize builds — never let two builds race (a double-trigger once launched
# two builders minutes apart). Queued, not cancelled: cancelling a running
# build is exactly what leaks builders.
concurrency:
  group: build-golden-ami
  cancel-in-progress: false

jobs:
  build-ami:
    name: Build golden AMI (${{ matrix.flavor }})
    # Every golden AMI built by CI (release-chained workflow_run or manual
    # workflow_dispatch) is public and cross-account consumable by default.
    # The workflow_run arm gates on the triggering release's conclusion:
    # a failed release bumped no pin, so building would only re-bake the
    # previous generation on a 15-45min build slot.
    # NOTE: job-level `if:` cannot reference `matrix.*` in GitHub Actions;
    # flavor filtering happens in `strategy.matrix.flavor` via fromJSON().
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: >-
          ${{
            fromJSON(
              github.event_name == 'workflow_dispatch' && inputs.build_flavor == 'upstream' && '["upstream"]' ||
              github.event_name == 'workflow_dispatch' && inputs.build_flavor == 'antalya' && '["antalya"]' ||
              '["upstream", "antalya"]'
            )
          }}

    steps:
      - name: Mask account identifiers
        # The AWS account ID appears in log lines the action cannot
        # avoid printing (arn:aws:iam::<account>:… from the role ARN,
        # account numbers in aws CLI output). Secrets are auto-masked,
        # but this guards every OTHER place the ID could surface.
        run: echo "::add-mask::${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PACKER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer init
        run: packer init ${{ env.PACKER_DIR }}

      - name: Verify the chinit release exists (fail fast, no wait)
        id: chinit_ver
        # The tag lives in THIS repo — ls-remote authenticates with the
        # workflow GITHUB_TOKEN (contents:read) so the check works on a
        # private repo too.
        # Priority for CHINIT_VERSION:
        #   1. workflow_dispatch inputs.chinit_version (when set)
        #   2. workflow_run head_branch from "Release chinit" (e.g. v0.1.2 —
        #      ensures the chained AMI build always bakes the newly released
        #      tag even when roll-ami cannot push directly to protected main)
        #   3. default pin in clickhouse.pkr.hcl
        run: |
          CHINIT_VERSION="${{ github.event.inputs.chinit_version }}"
          CHINIT_VERSION="${CHINIT_VERSION#v}"
          if [ -z "$CHINIT_VERSION" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            WF_BRANCH="${{ github.event.workflow_run.head_branch }}"
            if echo "$WF_BRANCH" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              CHINIT_VERSION="${WF_BRANCH#v}"
            fi
          fi
          if [ -z "$CHINIT_VERSION" ]; then
            CHINIT_VERSION=$(awk '/variable "chinit_version"/,/^\}/' \
              "${{ env.PACKER_DIR }}/clickhouse.pkr.hcl" \
              | grep -oE 'default *= *"[0-9.]+"' | head -1 \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          fi
          [ -z "$CHINIT_VERSION" ] && { echo "chinit_version not found"; exit 1; }
          echo "checking chinit ${CHINIT_VERSION} tag (the release + assets may still be publishing — the build's last step waits)"
          git ls-remote --tags "https://x-access-token:${GITHUB_TOKEN}@github.com/stackgenhq/chinit.git" "refs/tags/v${CHINIT_VERSION}" \
            | grep -q "v${CHINIT_VERSION}" \
            || { echo "chinit v${CHINIT_VERSION} tag not found"; exit 1; }
          mkdir -p "${{ env.PACKER_DIR }}/chinit-artifacts"
          echo "$CHINIT_VERSION" > "${{ env.PACKER_DIR }}/chinit-artifacts/.version"
          echo "chinit_version=$CHINIT_VERSION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (${{ matrix.flavor }})
        id: build
        env:
          # Scope BUILD_ID per matrix flavor so parallel cleanup steps never
          # sweep the sibling flavor's in-flight builder instance/keypair/SG.
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.flavor }}
          # The repo is private: release assets are not anonymously
          # fetchable, and the packer template's LAST install step
          # downloads chinit from the release. Without this token the
          # download falls to the anonymous branch and 404s for the
          # full 20-minute poll window (the 0.2.36 stuck build: the
          # release was published and the assets existed — the job
          # just had no credentials to see them). contents:read
          # GITHUB_TOKEN; packer passes it into the builder as
          # CHINIT_DOWNLOAD_TOKEN (sensitive var — never printed).
          CHINIT_DOWNLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pipefail: without it `packer build | tee` reports tee's exit code
          # (always 0) and a FAILED build looks like a green job.
          set -o pipefail
          FLAVOR="${{ matrix.flavor }}"
          if [ "$FLAVOR" = "antalya" ]; then
            CH_VER="${{ github.event.inputs.antalya_clickhouse_version }}"
            if [ -z "$CH_VER" ] && [ "${{ github.event.inputs.build_flavor }}" = "antalya" ]; then
              CH_VER="${{ github.event.inputs.clickhouse_version }}"
            fi
            [ -z "$CH_VER" ] && CH_VER="26.8.34.20001.altinityantalya"
          else
            CH_VER="${{ github.event.inputs.clickhouse_version }}"
            [ -z "$CH_VER" ] && CH_VER="26.8.36.3"
          fi
          CHINIT_VER="${{ steps.chinit_ver.outputs.chinit_version }}"
          ANTALYA_SHA="${{ github.event.inputs.antalya_ci_sha }}"
          PUBLIC_AMI="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "false" ]; then
            PUBLIC_AMI="false"
          fi
          EXTRA=""
          [ -n "$ANTALYA_SHA" ] && EXTRA="-var antalya_ci_sha=${ANTALYA_SHA}"
          # Pass -var-file FIRST so explicit -var clickhouse_version / build_flavor
          # overrides defaults.pkrvars.hcl (in Packer HCL2 later vars win).
          # shellcheck disable=SC2086
          packer build \
            -var-file="${{ env.PACKER_DIR }}/defaults.pkrvars.hcl" \
            -var "region=${{ env.AWS_REGION }}" \
            -var "chinit_download_token=${CHINIT_DOWNLOAD_TOKEN}" \
            -var "chinit_version=${CHINIT_VER}" \
            -var "build_flavor=${FLAVOR}" \
            -var "clickhouse_version=${CH_VER}" \
            -var "public_ami=${PUBLIC_AMI}" \
            -var "ami_author=stackgen.com" \
            -var "build_id=${BUILD_ID}" \
            $EXTRA \
            "${{ env.PACKER_DIR }}/clickhouse.pkr.hcl" \
            | tee build.log
          # Extract the produced AMI id from the log
          AMI_ID=$(grep -oE 'ami-[a-z0-9]+' build.log | tail -1)
          [ -n "$AMI_ID" ] || { echo "Failed to extract AMI_ID from packer build output"; exit 1; }
          if [ "$PUBLIC_AMI" = "true" ]; then
            # Explicitly enforce and verify public launchPermission + backing snapshot
            # createVolumePermission so any AWS account can launch or copy-image the AMI.
            aws ec2 modify-image-attribute \
              --region "${{ env.AWS_REGION }}" \
              --image-id "$AMI_ID" \
              --launch-permission "Add=[{Group=all}]"
            SNAP_ID=$(aws ec2 describe-images \
              --region "${{ env.AWS_REGION }}" \
              --image-ids "$AMI_ID" \
              --query "Images[0].BlockDeviceMappings[0].Ebs.SnapshotId" \
              --output text)
            if [ -n "$SNAP_ID" ] && [ "$SNAP_ID" != "None" ]; then
              aws ec2 modify-snapshot-attribute \
                --region "${{ env.AWS_REGION }}" \
                --snapshot-id "$SNAP_ID" \
                --attribute createVolumePermission \
                --operation-type add \
                --group-names all
            fi
            IS_PUBLIC=$(aws ec2 describe-images \
              --region "${{ env.AWS_REGION }}" \
              --image-ids "$AMI_ID" \
              --query "Images[0].Public" \
              --output text)
            IS_ENCRYPTED=$(aws ec2 describe-images \
              --region "${{ env.AWS_REGION }}" \
              --image-ids "$AMI_ID" \
              --query "Images[0].BlockDeviceMappings[0].Ebs.Encrypted" \
              --output text)
            echo "Verified $AMI_ID (snapshot $SNAP_ID): Public=$IS_PUBLIC, Encrypted=$IS_ENCRYPTED"
            if [ "$IS_PUBLIC" != "True" ] && [ "$IS_PUBLIC" != "true" ]; then
              echo "ERROR: $AMI_ID is not public (Public=$IS_PUBLIC)"
              exit 1
            fi
            if [ "$IS_ENCRYPTED" != "False" ] && [ "$IS_ENCRYPTED" != "false" ]; then
              echo "ERROR: $AMI_ID root snapshot is encrypted ($IS_ENCRYPTED); public cross-account AMIs must have an unencrypted root snapshot"
              exit 1
            fi
          fi
          {
            echo "ami_id=$AMI_ID"
            echo "clickhouse_version=$CH_VER"
            echo "chinit_version=$CHINIT_VER"
            echo "public_ami=$PUBLIC_AMI"
          } >> "$GITHUB_OUTPUT"

      - name: Prune old ${{ matrix.flavor }} generations (keep ${{ env.KEEP_GENERATIONS }})
        run: |
          # List golden AMIs for THIS flavor oldest-first; deregister everything
          # past the KEEP_GENERATIONS newest, then delete their (only) snapshot.
          IDS=$(aws ec2 describe-images \
            --region ${{ env.AWS_REGION }} \
            --owners self \
            --filters "Name=tag:Purpose,Values=clickhouse-golden-ami" \
                      "Name=tag:Flavor,Values=${{ matrix.flavor }}" \
            --query "sort_by(Images,&CreationDate)[].ImageId" \
            --output text | tr '[:space:]' '\n' | grep '^ami-' || true)
          TOTAL=$(echo "$IDS" | grep -c '^ami-' || true)
          echo "golden AMIs (${{ matrix.flavor }}): $TOTAL (keeping newest ${{ env.KEEP_GENERATIONS }})"
          echo "$IDS" | head -n -${{ env.KEEP_GENERATIONS }} | while read -r AMI; do
            [ -z "$AMI" ] && continue
            # Never prune an AMI the repo still references (e.g. a tfvars
            # golden_ami_id that a copy-image was built from). The checked-out
            # tree is $GITHUB_WORKSPACE — grep it before deregistering.
            if grep -rF "$AMI" "$GITHUB_WORKSPACE" --exclude-dir=.git --exclude-dir=node_modules -q; then
              echo "keeping $AMI — referenced in repository, skipping"
              continue
            fi
            IN_USE=$(aws ec2 describe-instances --region "${{ env.AWS_REGION }}" \
              --filters "Name=image-id,Values=$AMI" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query 'length(Reservations[].Instances[])' --output text)
            if [ "$IN_USE" != "0" ]; then
              echo "keeping $AMI — $IN_USE instance(s) still use it, skipping"
              continue
            fi
            SNAP=$(aws ec2 describe-images --region "${{ env.AWS_REGION }}" \
              --image-ids "$AMI" --query "Images[0].BlockDeviceMappings[0].Ebs.SnapshotId" --output text)
            echo "deregistering $AMI (snapshot $SNAP)"
            aws ec2 deregister-image --region ${{ env.AWS_REGION }} --image-id "$AMI"
            if [ "$SNAP" != "None" ]; then
              aws ec2 modify-snapshot-attribute --region ${{ env.AWS_REGION }} \
                --snapshot-id "$SNAP" --attribute createVolumePermission \
                --operation-type remove --group-names all 2>/dev/null || true
              aws ec2 delete-snapshot --region ${{ env.AWS_REGION }} --snapshot-id "$SNAP"
            fi
          done

      # Packer cleans up its own temporary resources on success AND on
      # failure — but NOT when the runner is hard-cancelled mid-build (packer
      # is SIGKILLed before it can reap the builder instance, key pair, SG).
      # Sweep anything this run left behind, on every outcome. Scoped to this
      # run's BuildId tag so it can never touch another build's resources.
      - name: Cleanup orphaned builder resources
        if: always()
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.flavor }}
        run: |
          set -uo pipefail
          echo "Sweeping leftover packer resources for BuildId=${BUILD_ID}"

          # Terminate first — the instance is the expensive leak. Key pairs are
          # deletable immediately (independent of instance state). On a hard
          # cancellation the runner may kill this step at any point, so do the
          # high-value, quick actions before the slow wait loop; SGs require
          # the instance to be gone first.
          IDS=$(aws ec2 describe-instances \
            --region "${{ env.AWS_REGION }}" \
            --filters "Name=tag:BuildId,Values=${BUILD_ID}" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$IDS" ]; then
            echo "terminating instances: $IDS"
            # shellcheck disable=SC2086
            aws ec2 terminate-instances --region "${{ env.AWS_REGION }}" --instance-ids $IDS || true
          fi

          for kp in $(aws ec2 describe-key-pairs --region "${{ env.AWS_REGION }}" \
              --filters "Name=tag:BuildId,Values=${BUILD_ID}" \
              --query 'KeyPairs[].KeyName' --output text); do
            echo "deleting orphaned key pair: $kp"
            aws ec2 delete-key-pair --region "${{ env.AWS_REGION }}" --key-name "$kp" || true
          done

          if [ -n "$IDS" ]; then
            for _ in $(seq 1 24); do
              # shellcheck disable=SC2086
              STATE=$(aws ec2 describe-instances --region "${{ env.AWS_REGION }}" --instance-ids $IDS \
                --query 'Reservations[].Instances[].State.Name' --output text)
              case "$STATE" in *pending*|*running*|*stopping*|*shutting-down*) sleep 5;; *) break;; esac
            done
          fi

          for sg in $(aws ec2 describe-security-groups --region "${{ env.AWS_REGION }}" \
              --filters "Name=tag:BuildId,Values=${BUILD_ID}" \
              --query 'SecurityGroups[].GroupId' --output text); do
            echo "deleting orphaned security group: $sg"
            aws ec2 delete-security-group --region "${{ env.AWS_REGION }}" --group-id "$sg" || true
          done

          # The CI role has no ec2:DeleteVolume permission, but the root
          # volume is delete_on_termination, so nothing should linger.
          # Describe (allowed) and surface any leftovers for manual review.
          # This must never fail the build — it is best-effort diagnostics.
          aws ec2 describe-volumes --region "${{ env.AWS_REGION }}" \
            --filters "Name=tag:BuildId,Values=${BUILD_ID}" \
            --query 'Volumes[].[VolumeId,State]' --output text | \
          while read -r v state; do
            [ -z "$v" ] && continue
            echo "WARN: volume $v (state=$state) carries BuildId=${BUILD_ID}; needs manual deletion"
          done || true

      - name: Summary
        run: |
          {
            echo "## Golden AMI built (${{ matrix.flavor }}) 🎉"
            echo ""
            echo "- **Flavor:** \`${{ matrix.flavor }}\`"
            echo "- **ClickHouse version:** \`${{ steps.build.outputs.clickhouse_version }}\`"
            echo "- **chinit version:** \`${{ steps.build.outputs.chinit_version }}\`"
            echo "- **AMI id:** \`${{ steps.build.outputs.ami_id }}\` (\`${{ env.AWS_REGION }}\`, public=\`${{ steps.build.outputs.public_ami }}\`, launchable & copyable by any AWS account)"
            echo ""
            echo "To use it, set in tfvars:"
            echo '```hcl'
            echo "golden_ami_id = \"${{ steps.build.outputs.ami_id }}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
