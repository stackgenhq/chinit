# golangci-lint (v2 format) for chinit — the node bootstrapper in
# cmd/chinit. The default linter set (errcheck, govet, ineffassign,
# staticcheck, unused) is the gate; extras below are cheap correctness
# wins. Run: golangci-lint run ./...
version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - misspell
    - predeclared
    - revive
    - unconvert
    - unparam
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000 # package comments live in doc.go, not every file
        - -ST1003 # domain vocabulary (chk, ARecord) wins over TLDR casing
        - -ST1005 # error strings carry domain phrasing (non-Go words)
        - -QF1003 # converted tagged switches read worse than if-chains
        - -QF1008 # embedded-field selectors stay explicit
        - -ST1016 # historical method-receiver names are load-bearing docs
    revive:
      severity: warning
  exclusions:
    rules:
      # Generated operator SDK code (vendor copies) is not ours to lint.
      - path: pkg/chinit/chop/
        linters:
          - gocritic
          - revive
          - staticcheck
          - stylecheck
      # Test fakes stub interfaces with unused receivers by design.
      - path: _test\.go
        linters:
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/stackgenhq/chinit
