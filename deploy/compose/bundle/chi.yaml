apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: compose-demo
spec:
  configuration:
    clusters:
      - name: compose-demo
        secure: "yes"
        layout:
          shards:
            - name: "01"
              replicasCount: 4
    zookeeper:
      nodes:
        - host: keeper-0.ch.local
          port: 9181
    profiles:
      default/async_insert: "1"
      default/wait_for_async_insert: "1"
      default/opentelemetry_start_trace_probability: "1.0"
      default/opentelemetry_start_keeper_trace_probability: "1.0"
      ingest/opentelemetry_start_trace_probability: "1.0"
      ingest/opentelemetry_start_keeper_trace_probability: "1.0"
    settings:
      tcp_port_secure: "9440"
      max_concurrent_queries: "64"
      timezone: "UTC"
      asynchronous_metrics_update_period_s: "1"
      query_log/partition_by: "toYYYYMM(event_date)"
      query_log/ttl: "event_date + INTERVAL 7 DAY DELETE"
    files:
      server-logger.xml: |
        <clickhouse>
            <logger>
                <level>information</level>
                <errorlog_level>error</errorlog_level>
                <log>/var/log/clickhouse-server/clickhouse-server.log</log>
                <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>
                <size>100M</size>
                <count>3</count>
                <formatting>
                    <type>json</type>
                    <names>
                        <date_time>timestamp</date_time>
                        <level>severity</level>
                        <message>message</message>
                        <source_file>source_file</source_file>
                        <source_line>source_line</source_line>
                    </names>
                </formatting>
            </logger>
        </clickhouse>
      server-prometheus.xml: |
        <clickhouse>
            <prometheus>
                <endpoint>/metrics</endpoint>
                <port>9363</port>
                <host>127.0.0.1</host>
                <metrics>true</metrics>
                <events>true</events>
                <asynchronous_metrics>true</asynchronous_metrics>
                <status_info>true</status_info>
            </prometheus>
        </clickhouse>
    users:
      default/passwordFrom: "default-password"
      default/profile: readonly
      default/quota: default
      admin/passwordFrom: "admin-password"
      admin/profile: default
      admin/access_management: "1"
      writer/passwordFrom: "writer-password"
      writer/profile: ingest
